# CS_Agent 前端：SPA 靜態服務 + 同源反代
# /ws/chat → backend:8000（WebSocket）
# /health  → backend:8000（整棧健康檢查，走前端單一 port 即可確認）

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 帶 hash 的靜態資源：長快取
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # WebSocket 反代；read/send timeout 拉長，避免長對話被 nginx 掐斷
    location /ws/chat {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # 便利用：經前端 port 檢查後端健康
    location /health {
        proxy_pass http://backend:8000/health;
    }

    # SPA fallback：非檔案路徑一律回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
